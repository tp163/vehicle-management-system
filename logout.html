<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out | CSC</title>
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        :root { --primary-color: #0d6efd; }
        body { 
            background-color: #f8f9fa; 
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logout-card {
            max-width: 450px;
            width: 90%;
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(13, 110, 253, 0.1);
            color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2rem;
        }
        .countdown-text {
            font-size: 0.9rem;
            color: #6c757d;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="logout-card">
        <div class="icon-box">
            <i class="bi bi-shield-check"></i>
        </div>
        <h3 class="fw-bold">Successfully Logged Out</h3>
        <p class="text-secondary">Thank you for using Chinthaka Service Center. Your session has been safely closed.</p>
        
        <div class="d-grid gap-2 mt-4">
            <a href="/Users/USER/desktop/vsms/home.html" class="btn btn-primary py-2 rounded-pill fw-bold">
                <i class="bi bi-house-door me-2"></i>Back to Home
            </a>
            <a href="/Users/USER/desktop/vsms/home.html" class="btn btn-outline-secondary py-2 rounded-pill">
                Login Again
            </a>
        </div>

        <p class="countdown-text">
            Redirecting to home in <span id="timer">5</span> seconds...
        </p>
    </div>

    <script>
        // 1. CLEAR USER DATA
        // This ensures nobody can hit "Back" and see the dashboard
        localStorage.removeItem('currentUser');
        localStorage.removeItem('vsms_active_session'); // If you use this

        // 2. REDIRECT TIMER
        let seconds = 5;
        const timerElement = document.getElementById('timer');

        const countdown = setInterval(() => {
            seconds--;
            timerElement.innerText = seconds;
            if (seconds <= 0) {
                clearInterval(countdown);
                window.location.href = "home.html"; // Go back to landing page
            }
        }, 1000);
    </script>

</body>
</html>
