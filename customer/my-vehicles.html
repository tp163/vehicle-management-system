<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vehicles - VSMS</title>
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --primary-color: #0d6efd; --bg-light: #f8f9fa; }
        body { background-color: var(--bg-light); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        .navbar-brand { font-weight: bold; letter-spacing: 1px; }
        
        .page-header { background: white; padding: 30px 0; border-bottom: 1px solid #dee2e6; margin-bottom: 30px; }
        
        .vehicle-card { 
            border: none; 
            border-radius: 15px; 
            transition: all 0.3s ease;
            background: white;
        }
        .vehicle-card:hover { 
            transform: translateY(-10px); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important; 
        }

        .plate-badge {
            background: #333;
            color: #fff;
            padding: 5px 15px;
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            display: inline-block;
        }

        .spec-label { color: #6c757d; font-size: 0.8rem; text-transform: uppercase; font-weight: bold; }
        .spec-value { color: #212529; font-weight: 600; }
        
        /* Mini Tracker Style */
        .mini-tracker { display: flex; justify-content: space-between; position: relative; padding: 10px 0; }
        .t-step { width: 25px; height: 25px; background: #eee; border-radius: 50%; z-index: 2; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; }
        .t-step.active { background: #198754; color: white; }
        .t-line { position: absolute; top: 22px; left: 0; right: 0; height: 2px; background: #eee; z-index: 1; }

        .modal-content { border-radius: 15px; border: none; }
        .modal-header { border-radius: 15px 15px 0 0; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="customer-dashboard.html"><i class="bi bi-gear-fill me-2"></i>VSMS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="customer-dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="my-vehicles.html">My Vehicles</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">History</a></li>
                    <li class="nav-item dropdown">
                        <!-- userNameDisplay ID moved here to sync with JS -->
                        <a class="nav-link dropdown-toggle" href="#" id="userNameDisplay" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> Loading...
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                            <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile Settings</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="../login.html"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header shadow-sm">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="fw-bold mb-1">My Garage</h2>
                    <p class="text-muted mb-0" id="vehicleCountText">Fetching your fleet...</p>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-primary rounded-pill px-3" onclick="location.reload()">
                        <i class="bi bi-arrow-clockwise"></i>
                    </button>
                    <button class="btn btn-primary rounded-pill px-4 fw-bold" data-bs-toggle="modal" data-bs-target="#requestVehicleModal">
                        <i class="bi bi-plus-lg me-2"></i>Register Vehicle
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Vehicles Grid Container -->
    <div class="container mb-5">
        <div class="row g-4" id="myGarageContainer">
            <!-- Spinner while loading -->
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Synchronizing with Workshop...</p>
            </div>
        </div>
    </div>

    <!-- Modal: Request New Vehicle Registration -->
    <div class="modal fade" id="requestVehicleModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold">Register New Vehicle</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="vehicleRegistrationForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">License Plate Number</label>
                            <input type="text" class="form-control" placeholder="e.g. WP ABC-1234" required>
                            <div class="form-text">As shown on your vehicle's revenue license.</div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Brand</label>
                                <input type="text" class="form-control" placeholder="e.g. Toyota" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Model</label>
                                <input type="text" class="form-control" placeholder="e.g. Corolla" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Manufacture Year</label>
                                <input type="number" class="form-control" placeholder="e.g. 2020" min="1900" max="2099" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Vehicle Color</label>
                                <input type="text" class="form-control" placeholder="e.g. White" required>
                            </div>
                        </div>
                        <div class="alert alert-info py-2 mb-4" style="font-size: 0.85rem;">
                            <i class="bi bi-info-circle me-2"></i> Admin verification is required.
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" onclick="alert('Request sent to admin.')">
                            Submit for Verification
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 1. SIMULATE LOGGED IN USER
            const loggedInUser = "John Doe"; 
            document.getElementById('userNameDisplay').innerHTML = `<i class="bi bi-person-circle me-1"></i> ${loggedInUser}`;

            function renderMyGarage() {
                const garageContainer = document.getElementById('myGarageContainer');
                
                // 2. GET DATA FROM ADMIN'S KEYS
                const allVehicles = JSON.parse(localStorage.getItem('vsms_vehicles')) || [];
                const allServices = JSON.parse(localStorage.getItem('vsms_services')) || [];

                // 3. FILTER VEHICLES FOR THIS OWNER
                const myVehicles = allVehicles.filter(v => v.owner === loggedInUser);
                
                document.getElementById('vehicleCountText').innerText = `You have ${myVehicles.length} vehicles registered.`;

                if (myVehicles.length === 0) {
                    garageContainer.innerHTML = `<div class="col-12 text-center text-muted py-5"><h5>No vehicles found for your account.</h5></div>`;
                    return;
                }

                garageContainer.innerHTML = ''; 

                myVehicles.forEach(veh => {
                    const activeJob = allServices.find(s => s.plate === veh.plate && s.status !== "Ready");
                    
                    const lastService = allServices
                        .filter(s => s.plate === veh.plate && s.status === "Ready")
                        .sort((a, b) => new Date(b.date) - new Date(a.date))[0];

                    const statusClass = activeJob ? "bg-info text-dark" : "bg-success text-white";
                    const statusText = activeJob ? `<i class="bi bi-tools me-1"></i> ${activeJob.status}` : `<i class="bi bi-check-circle me-1"></i> On Road`;

                    let step1 = "", step2 = "", step3 = "";
                    if(activeJob) {
                        step1 = "active";
                        if(activeJob.status === "In Progress" || activeJob.status === "Testing") step2 = "active";
                        if(activeJob.status === "Testing") step3 = "active";
                    }

                    const card = `
                        <div class="col-md-6">
                            <div class="card vehicle-card shadow-sm h-100">
                                <div class="card-body p-4">
                                    <div class="d-flex justify-content-between align-items-start mb-3">
                                        <div>
                                            <span class="plate-badge mb-2">${veh.plate}</span>
                                            <h4 class="fw-bold mb-0">${veh.brand} ${veh.model}</h4>
                                            <span class="badge ${statusClass} mt-2">${statusText}</span>
                                        </div>
                                        <i class="bi bi-car-front-fill text-primary display-6 opacity-25"></i>
                                    </div>

                                    ${activeJob ? `
                                        <div class="bg-light p-2 rounded mb-3">
                                            <small class="fw-bold text-muted d-block mb-1">Service Progress:</small>
                                            <div class="mini-tracker">
                                                <div class="t-line"></div>
                                                <div class="t-step ${step1}" title="Received"><i class="bi bi-box"></i></div>
                                                <div class="t-step ${step2}" title="In Progress"><i class="bi bi-tools"></i></div>
                                                <div class="t-step ${step3}" title="Testing"><i class="bi bi-search"></i></div>
                                                <div class="t-step" title="Ready"><i class="bi bi-flag"></i></div>
                                            </div>
                                        </div>
                                    ` : ''}

                                    <hr class="opacity-25">

                                    <div class="row g-2">
                                        <div class="col-6">
                                            <p class="spec-label mb-0">Year</p>
                                            <p class="spec-value mb-0">${veh.year}</p>
                                        </div>
                                        <div class="col-6">
                                            <p class="spec-label mb-0">Last Service</p>
                                            <p class="spec-value mb-0">${lastService ? lastService.type : 'N/A'}</p>
                                        </div>
                                    </div>

                                    <div class="mt-3 d-flex gap-2">
                                        <button class="btn btn-sm btn-outline-primary w-100">Service History</button>
                                        <button class="btn btn-sm btn-light border"><i class="bi bi-info-circle"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    garageContainer.innerHTML += card;
                });
            }

            renderMyGarage();
        });
    </script>
</body>
</html>
