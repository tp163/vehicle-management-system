<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services - VSMS</title>
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/services.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar shadow">
        <h4 class="text-center py-3 border-bottom border-light border-opacity-25">VSMS</h4>
        <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="customers.html"><i class="bi bi-people"></i> Customers</a>
        <a href="vehicles.html"><i class="bi bi-car-front"></i> Vehicles</a>
        <a class="active" href="services.html"><i class="bi bi-tools"></i> Services</a>
        <a href="mechanics.html"><i class="bi bi-person-workspace"></i> Mechanics</a>
        <a href="staff.html"><i class="bi bi-person-badge"></i> Staff</a>
        <a href="inventory.html"><i class="bi bi-box-seam"></i> Inventory</a>
        <a href="invoices.html"><i class="bi bi-receipt"></i> Invoices</a>
        <a href="reports.html"><i class="bi bi-file-earmark-text"></i> Reports</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <nav class="navbar bg-white shadow-sm mb-4 px-3 rounded">
            <h4 class="mb-0 text-primary fw-bold">Service Management</h4>
            <div class="ms-auto d-flex gap-2">
                <button class="btn btn-primary btn-sm px-3" data-bs-toggle="modal" data-bs-target="#addJobModal">
                    <i class="bi bi-plus-circle"></i> New Service Job
                </button>
            </div>
        </nav>

        <!-- Service Stats -->
        <!-- Service Stats -->
<div class="row mb-4">
    <div class="col-md-4">
        <div class="card border-0 shadow-sm p-3 border-start border-primary border-4">
            <small class="text-muted fw-bold">ACTIVE JOBS</small>
            <!-- Added ID for Active (In Progress) -->
            <h3 id="activeJobsCount">0</h3>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card border-0 shadow-sm p-3 border-start border-warning border-4">
            <small class="text-muted fw-bold">PENDING APPROVAL</small>
            <!-- Added ID for Pending -->
            <h3 id="pendingApprovalCount">0</h3>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card border-0 shadow-sm p-3 border-start border-success border-4">
            <small class="text-muted fw-bold">COMPLETED TODAY</small>
            <!-- Added ID for Ready -->
            <h3 id="completedTodayCount">0</h3>
        </div>
    </div>
</div>
        <!-- Active Jobs Table -->
        <div class="card border-0 shadow-sm mb-5">
            <div class="card-header bg-white fw-bold py-3 text-primary">
                <i class="bi bi-play-circle me-2"></i>Current Workshop Jobs
            </div>
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th>Job ID</th>
                            <th>Vehicle No</th>
                            <th>Service Type</th>
                            <th>Assigned Mechanic</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="jobsTableBody">
                        <!-- Loaded via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal: New Service Job -->
    <div class="modal fade" id="addJobModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Launch New Service Job</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="jobForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Vehicle Number</label>
                            <select id="jPlate" class="form-select" required>
                                <option value="" selected disabled>Select Vehicle</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Service Type</label>
                            <select id="jType" class="form-select">
                                <option>Full Service</option>
                                <option>Oil Change</option>
                                <option>Brake Repair</option>
                                <option>Engine Diagnostic</option>
                                <option>Battery Replacement</option>
                                <option>Tire Replacement</option>
                                <option>Electrical Repair</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Assign Mechanic</label>
                            <select id="jMech" class="form-select" required>
                                <option value="" selected disabled>Select Mechanic</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Start Service</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/services.js"></script>
</body>
</html>
