<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - VSMS</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/inventory.css">
</head>
<body>

    <!-- Sidebar (Consistent with Invoice Page) -->
    <div class="sidebar shadow">
        <h4 class="text-center py-3 border-bottom border-light border-opacity-25">VSMS</h4>
        <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="customers.html"><i class="bi bi-people"></i> Customers</a>
        <a href="vehicles.html"><i class="bi bi-car-front"></i> Vehicles</a>
        <a href="services.html"><i class="bi bi-tools"></i> Services</a>
        <a href="mechanics.html"><i class="bi bi-person-workspace"></i> Mechanics</a>
        <a href="staff.html"><i class="bi bi-person-badge"></i> Staff</a>
        <a class="active" href="inventory.html"><i class="bi bi-box-seam"></i> Inventory</a>
        <a href="invoices.html"><i class="bi bi-receipt"></i> Invoices</a>
        <a href="reports.html"><i class="bi bi-file-earmark-text"></i> Reports</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <nav class="navbar bg-white shadow-sm mb-4 px-3 rounded">
            <h4 class="mb-0 text-primary fw-bold">Inventory Management</h4>
            <div class="d-flex align-items-center">
                <input type="text" id="searchInput" class="form-control form-control-sm me-2" placeholder="Search parts...">
                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addItemModal">
                    <i class="bi bi-plus-lg"></i> Add Item
                </button>
            </div>
        </nav>

        <!-- Inventory Stats Summary -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card border-0 shadow-sm p-3 border-start border-primary border-4">
                    <small class="text-muted fw-bold">TOTAL ITEMS</small>
                    <h3 id="totalItems">0</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm p-3 border-start border-danger border-4">
                    <small class="text-muted fw-bold">LOW STOCK ALERTS</small>
                    <h3 class="text-danger" id="lowStockCount">0</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm p-3 border-start border-success border-4">
                    <small class="text-muted fw-bold">INVENTORY VALUE</small>
                     <h3 id="totalValue">Rs.0.00</h3>
                </div>
            </div>
        </div>

        <!-- Inventory Table -->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th>Part ID</th>
                            <th>Part Name</th>
                            <th>Category</th>
                            <th>Unit Price</th>
                            <th>Quantity</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTableBody">
                        <!-- Content loaded by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal: Add Item -->
    <div class="modal fade" id="addItemModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Add New Spare Part</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="inventoryForm">
                        <div class="mb-3">
                            <label class="form-label">Part Name</label>
                            <input type="text" id="pName" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Category</label>
                                <select id="pCategory" class="form-select">
                                    <option>Engine</option>
                                    <option>Brakes</option>
                                    <option>Electrical</option>
                                    <option>Fluids/Oil</option>
                                    <option>Tires</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Price (Rs.)</label>
                                <input type="number" id="pPrice" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Initial Quantity</label>
                            <input type="number" id="pQty" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Save to Inventory</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/inventory.js"></script>
</body>
</html>
