<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Management - VSMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/mechanics.css"> <!-- Reusing mechanics CSS for consistency -->
</head>
<body>

    <div class="sidebar shadow">
        <h4 class="text-center py-3 border-bottom border-light border-opacity-25">VSMS</h4>
        <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="customers.html"><i class="bi bi-people"></i> Customers</a>
        <a href="vehicles.html"><i class="bi bi-car-front"></i> Vehicles</a>
        <a href="services.html"><i class="bi bi-tools"></i> Services</a>
        <a href="mechanics.html"><i class="bi bi-person-workspace"></i> Mechanics</a>
        <a class="active" href="staff.html"><i class="bi bi-person-badge"></i> Staff</a>
        <a href="inventory.html"><i class="bi bi-box-seam"></i> Inventory</a>
        <a href="invoices.html"><i class="bi bi-receipt"></i> Invoices</a>
    </div>

    <div class="main-content">
        <nav class="navbar bg-white shadow-sm mb-4 px-3 rounded">
            <h4 class="mb-0 text-primary fw-bold">Staff Management</h4>
            <button class="btn btn-primary btn-sm ms-auto" data-bs-toggle="modal" data-bs-target="#addStaffModal">
                <i class="bi bi-person-plus-fill"></i> Add Staff Member
            </button>
        </nav>

        <!-- Staff Stats -->
        <div class="row mb-4 text-center">
            <div class="col-md-3">
                <div class="card border-0 shadow-sm p-3 border-start border-primary border-4">
                    <small class="text-muted fw-bold">TOTAL STAFF</small>
                    <h3 id="totalStaffCount">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm p-3 border-start border-success border-4">
                    <small class="text-muted fw-bold text-success">ACTIVE</small>
                    <h3 id="activeStaffCount">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm p-3 border-start border-info border-4">
                    <small class="text-muted fw-bold text-info">MANAGEMENT</small>
                    <h3 id="mgmtCount">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm p-3 border-start border-danger border-4">
                    <small class="text-muted fw-bold text-danger">ON LEAVE</small>
                    <h3 id="leaveCount">0</h3>
                </div>
            </div>
        </div>

        <!-- Staff List Table -->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th>Employee</th>
                            <th>Role</th>
                            <th>Contact & Email</th> <!-- Combined for better space -->
                            <th>Address</th>   
                            <th>Shift</th>                            
                            <th>Status</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="staffTableBody">
                        <!-- Loaded via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal: Add Staff -->
    <div class="modal fade" id="addStaffModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">New Staff Profile</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="staffForm">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="sName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Role</label>
                            <select id="sRole" class="form-select">
                                <option>Branch Manager</option>
                                <option>Receptionist</option>
                                <option>Cashier</option>
                                <option>Inventory Manager</option>
                                <option>Security</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Shift</label>
                                <select id="sShift" class="form-select">
                                    <option>Morning (8AM-4PM)</option>
                                    <option>Full Day (9AM-6PM)</option>
                                    <option>Evening (2PM-10PM)</option>
                                </select>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Email Address</label>
                                    <input type="email" id="sEmail" class="form-control" placeholder="staff@vsms.com" required>
                                </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Phone No</label>
                                <input type="text" id="sPhone" class="form-control" required>
                            </div>
                            <div class="mb-3">
                            <label class="form-label">Home Address</label>
                            <textarea id="sAddress" class="form-control" rows="2" placeholder="Street, City, Province" required></textarea>
                        </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Register Staff</button>
                    </form>
                </div>
            </div>
        </div>
    </div>



    <!-- Modal: Edit Staff -->
<div class="modal fade" id="editStaffModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title">Edit Staff Member</h5>
                <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editStaffForm">
                    <input type="hidden" id="editIndex">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="editName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="editEmail" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Update Information</button>
                </form>
            </div>
        </div>
    </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/staff.js"></script>
</body>
</html>
