<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Services - VSMS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
font-family: Arial;
background:#f4f6f9;
}

.sidebar{
height:100vh;
width:220px;
position:fixed;
background:#0d6efd;
color:white;
padding-top:20px;
}

.sidebar a{
display:block;
padding:12px 20px;
color:white;
text-decoration:none;
border-radius:5px;
}

.sidebar a:hover{
background:rgba(255,255,255,0.2);
}

.main-content{
margin-left:220px;
padding:20px;
}

</style>

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

<h4 class="text-center">VSMS</h4>

<a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>

<a href="customers.html"><i class="bi bi-people"></i> Customers</a>

<a href="vehicles.html"><i class="bi bi-car-front"></i> Vehicles</a>

<a class="active" href="#"><i class="bi bi-tools"></i> Services</a>

<a href="#"><i class="bi bi-person-workspace"></i> Mechanics</a>

<a href="#"><i class="bi bi-box-seam"></i> Inventory</a>

<a href="#"><i class="bi bi-file-earmark-text"></i> Reports</a>

</div>

<!-- Main Content -->

<div class="main-content">

<nav class="navbar bg-white shadow-sm mb-4">
<div class="container-fluid">
<h4>Service Management</h4>
</div>
</nav>

<!-- Book Service Button -->

<button class="btn btn-warning mb-3" data-bs-toggle="modal" data-bs-target="#bookServiceModal">

<i class="bi bi-tools"></i> Book Service

</button>

<!-- Search -->

<input type="text" class="form-control mb-3" placeholder="Search service">

<!-- Service Table -->

<div class="card">

<div class="card-header bg-warning">
Service List
</div>

<div class="card-body table-responsive">

<table class="table table-striped table-hover">

<thead>

<tr>

<th>Service ID</th>
<th>Vehicle</th>
<th>Customer</th>
<th>Mechanic</th>
<th>Date</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody>

<tr>

<td>001</td>
<td>WP ABC 1234</td>
<td>John Doe</td>
<td>Mike</td>
<td>2026-03-11</td>

<td>
<span class="badge bg-warning">In Progress</span>
</td>

<td>

<button class="btn btn-sm btn-primary">
Update
</button>

</td>

</tr>

<tr>

<td>002</td>
<td>WP XYZ 5678</td>
<td>Mary Jane</td>
<td>Tom</td>
<td>2026-03-10</td>

<td>
<span class="badge bg-success">Completed</span>
</td>

<td>

<button class="btn btn-sm btn-secondary">
View
</button>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

<!-- Book Service Modal -->

<div class="modal fade" id="bookServiceModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5>Book Service</h5>

<button class="btn-close" data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">

<form>

<div class="mb-3">

<label>Select Vehicle</label>

<select class="form-control">

<option>WP ABC 1234</option>
<option>WP XYZ 5678</option>

</select>

</div>

<div class="mb-3">

<label>Select Mechanic</label>

<select class="form-control">

<option>Mike</option>
<option>Tom</option>

</select>

</div>

<div class="mb-3">

<label>Service Type</label>

<input type="text" class="form-control">

</div>

<div class="mb-3">

<label>Service Date</label>

<input type="date" class="form-control">

</div>

<div class="mb-3">

<label>Status</label>

<select class="form-control">

<option>Pending</option>
<option>In Progress</option>
<option>Completed</option>

</select>

</div>

<button class="btn btn-warning">Save Service</button>

</form>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
