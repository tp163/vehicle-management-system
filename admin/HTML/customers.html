<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - VSMS</title>
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/customers.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar shadow">
        <h4 class="text-center py-3 border-bottom border-light border-opacity-25">VSMS</h4>
        <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a class="active" href="customers.html"><i class="bi bi-people"></i> Customers</a>
        <a href="vehicles.html"><i class="bi bi-car-front"></i> Vehicles</a>
        <a href="services.html"><i class="bi bi-tools"></i> Services</a>
        <a href="mechanics.html"><i class="bi bi-person-workspace"></i> Mechanics</a>
         <a href="staff.html"><i class="bi bi-person-badge"></i> Staff</a>
        <a href="inventory.html"><i class="bi bi-box-seam"></i> Inventory</a>
        <a href="invoices.html"><i class="bi bi-receipt"></i> Invoices</a>
        <a href="reports.html"><i class="bi bi-file-earmark-text"></i> Reports</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <nav class="navbar bg-white shadow-sm mb-4 px-3 rounded text-primary">
            <h4 class="mb-0 fw-bold">Customer Directory</h4>
            <div class="ms-auto d-flex align-items-center gap-3">
                <input type="text" id="custSearch" class="form-control form-control-sm" placeholder="Search name or phone...">
                <button class="btn btn-primary btn-sm px-3" data-bs-toggle="modal" data-bs-target="#addCustomerModal">
                    <i class="bi bi-person-plus"></i> New Customer
                </button>
            </div>
        </nav>

       <!-- Stats Row -->
<div class="row mb-4">
    <div class="col-md-4">
        <div class="card border-0 shadow-sm p-3 text-center">
            <small class="text-muted fw-bold">TOTAL REGISTERED</small>
            <h3 id="totalCustCount" class="text-primary">0</h3>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card border-0 shadow-sm p-3 text-center">
            <small class="text-muted fw-bold">NEW THIS MONTH</small>
            <h3 id="newThisMonthCount" class="text-success">0</h3>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card border-0 shadow-sm p-3 text-center">
            <small class="text-muted fw-bold">FREQUENT VISITORS</small>
            <h3 id="frequentVisitorsCount" class="text-warning">0</h3>
        </div>
    </div>
</div>

        <!-- Customer Table -->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th>Reg No</th> 
                            <th>Customer Name</th>
                            <th>Contact Info</th>
                            <th>Address</th>
                            <th>Vehicle Count</th>
                            <th>Vehicle List</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="customerTableBody">
                        <!-- Loaded via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal: Add Customer -->
    <div class="modal fade" id="addCustomerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Register New Customer</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="customerForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Full Name</label>
                            <input type="text" id="cName" class="form-control" placeholder="e.g. Nimal Perera" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Phone Number</label>
                            <input type="text" id="cPhone" class="form-control" placeholder="077-XXXXXXX" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Email Address</label>
                            <input type="email" id="cEmail" class="form-control" placeholder="nimal@gmail.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Home Address</label>
                            <textarea id="cAddress" class="form-control" rows="2" placeholder="No, Street, City"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Save Customer</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/customers.js"></script>
</body>
</html>
