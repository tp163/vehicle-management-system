<!-- Main Content -->
<div class="main-content">
    <nav class="navbar bg-white shadow-sm mb-4 px-3 rounded">
        <h4 class="mb-0 text-success fw-bold"><i class="bi bi-cash-stack"></i> Monthly Income Report</h4>
        <div class="ms-auto d-flex gap-2 no-print">
            <input type="month" id="reportMonth" class="form-control form-control-sm" value="2024-05">
            <button class="btn btn-success btn-sm" onclick="window.print()"><i class="bi bi-printer"></i> Print Report</button>
        </div>
    </nav>

    <!-- Financial Summary Cards -->
    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card border-0 shadow-sm p-3 bg-success text-white">
                <small class="fw-bold">TOTAL REVENUE</small>
                <h3 id="totalRevenue">Rs. 0.00</h3>
                <i class="bi bi-graph-up-arrow position-absolute end-0 bottom-0 m-2 opacity-25 fs-1"></i>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm p-3 border-start border-primary border-4">
                <small class="text-muted fw-bold">LABOR INCOME</small>
                <h3 id="laborIncome">Rs. 0.00</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm p-3 border-start border-info border-4">
                <small class="text-muted fw-bold">PARTS SALES</small>
                <h3 id="partsIncome">Rs. 0.00</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm p-3 border-start border-warning border-4">
                <small class="text-muted fw-bold text-warning">PENDING PAYMENTS</small>
                <h3 id="pendingIncome">Rs. 0.00</h3>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- Daily Income Chart -->
        <div class="col-lg-8 mb-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white fw-bold">Daily Revenue Trend</div>
                <div class="card-body">
                    <canvas id="dailyIncomeChart" height="250"></canvas>
                </div>
            </div>
        </div>

        <!-- Income by Service Type -->
        <div class="col-lg-4 mb-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white fw-bold">Revenue by Service</div>
                <div class="card-body">
                    <canvas id="serviceTypeChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Detailed Transaction Table -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3">
            <h6 class="mb-0 fw-bold text-muted">Transaction Details</h6>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light small">
                    <tr>
                        <th>Date</th>
                        <th>Invoice No</th>
                        <th>Customer</th>
                        <th>Service Labor</th>
                        <th>Parts Cost</th>
                        <th>Total</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="incomeTableBody">
                    <!-- Loaded via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>
