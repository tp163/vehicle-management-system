<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customers - VSMS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
font-family: Arial;
background:#f4f6f9;
}

.sidebar{
height:100vh;
width:220px;
position:fixed;
background:#0d6efd;
color:white;
padding-top:20px;
}

.sidebar a{
display:block;
padding:12px 20px;
color:white;
text-decoration:none;
border-radius:5px;
}

.sidebar a:hover{
background:rgba(255,255,255,0.2);
}

.main-content{
margin-left:220px;
padding:20px;
}

</style>

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

<h4 class="text-center">VSMS</h4>

<a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>

<a class="active" href="#"><i class="bi bi-people"></i> Customers</a>

<a href="#"><i class="bi bi-car-front"></i> Vehicles</a>

<a href="#"><i class="bi bi-tools"></i> Services</a>

<a href="#"><i class="bi bi-person-workspace"></i> Mechanics</a>

<a href="#"><i class="bi bi-box-seam"></i> Inventory</a>

<a href="#"><i class="bi bi-file-earmark-text"></i> Reports</a>

</div>

<!-- Main Content -->

<div class="main-content">

<!-- Top bar -->

<nav class="navbar navbar-light bg-white shadow-sm mb-4">
<div class="container-fluid">
<h4>Customer Management</h4>
</div>
</nav>

<!-- Add customer button -->

<button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addCustomerModal">

<i class="bi bi-person-plus"></i> Add Customer

</button>

<!-- Search -->

<input type="text" class="form-control mb-3" placeholder="Search customer">

<!-- Customer table -->

<div class="card">

<div class="card-header bg-primary text-white">

Customer List

</div>

<div class="card-body table-responsive">

<table class="table table-striped table-hover">

<thead>

<tr>

<th>ID</th>
<th>Name</th>
<th>Phone</th>
<th>Email</th>
<th>Address</th>
<th>Action</th>

</tr>

</thead>

<tbody>

<tr>

<td>1</td>
<td>John Doe</td>
<td>0771234567</td>
<td>john@email.com</td>
<td>Colombo</td>

<td>

<button class="btn btn-sm btn-warning">

<i class="bi bi-pencil"></i>

</button>

<button class="btn btn-sm btn-danger">

<i class="bi bi-trash"></i>

</button>

</td>

</tr>

<tr>

<td>2</td>
<td>Mary Jane</td>
<td>0759876543</td>
<td>mary@email.com</td>
<td>Kandy</td>

<td>

<button class="btn btn-sm btn-warning">

<i class="bi bi-pencil"></i>

</button>

<button class="btn btn-sm btn-danger">

<i class="bi bi-trash"></i>

</button>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

<!-- Add Customer Modal -->

<div class="modal fade" id="addCustomerModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5>Add Customer</h5>

<button class="btn-close" data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">

<form>

<div class="mb-3">

<label>Name</label>

<input type="text" class="form-control">

</div>

<div class="mb-3">

<label>Phone</label>

<input type="text" class="form-control">

</div>

<div class="mb-3">

<label>Email</label>

<input type="email" class="form-control">

</div>

<div class="mb-3">

<label>Address</label>

<textarea class="form-control"></textarea>

</div>

<button class="btn btn-primary">Save</button>

</form>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
