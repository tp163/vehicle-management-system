<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanics - VSMS</title>
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/mechanics.css">
</head>
<body>

    <!-- Sidebar (Consistent with other pages) -->
    <div class="sidebar shadow">
        <h4 class="text-center py-3 border-bottom border-light border-opacity-25">VSMS</h4>
        <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="customers.html"><i class="bi bi-people"></i> Customers</a>
        <a href="vehicles.html"><i class="bi bi-car-front"></i> Vehicles</a>
        <a href="services.html"><i class="bi bi-tools"></i> Services</a>
        <a class="active" href="mechanics.html"><i class="bi bi-person-workspace"></i> Mechanics</a>
        <a href="staff.html"><i class="bi bi-person-badge"></i> Staff</a>
        <a href="inventory.html"><i class="bi bi-box-seam"></i> Inventory</a>
        <a href="invoices.html"><i class="bi bi-receipt"></i> Invoices</a>
        <a href="reports.html"><i class="bi bi-file-earmark-text"></i> Reports</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <nav class="navbar bg-white shadow-sm mb-4 px-3 rounded">
            <h4 class="mb-0 text-primary fw-bold">Mechanic Management</h4>
            <button class="btn btn-primary btn-sm ms-auto" data-bs-toggle="modal" data-bs-target="#addMechanicModal">
                <i class="bi bi-person-plus-fill"></i> Add Mechanic
            </button>
        </nav>

        <!-- Mechanic Stats -->
       <!-- Service Stats -->
<!-- Mechanic Stats -->
<div class="row mb-4">
    <div class="col-md-3">
        <div class="card border-0 shadow-sm p-3">
            <small class="text-muted fw-bold">TOTAL STAFF</small>
            <!-- ID MATCHED: totalMechanics -->
            <h3 id="totalMechanics">0</h3>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card border-0 shadow-sm p-3 border-start border-success border-4">
            <small class="text-muted fw-bold text-success">AVAILABLE</small>
            <!-- ID MATCHED: availableCount -->
            <h3 id="availableCount">0</h3>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card border-0 shadow-sm p-3 border-start border-warning border-4">
            <small class="text-muted fw-bold text-warning">BUSY</small>
            <!-- ID MATCHED: busyCount -->
            <h3 id="busyCount">0</h3>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card border-0 shadow-sm p-3 border-start border-danger border-4">
            <small class="text-muted fw-bold text-danger">OFF-DUTY</small>
            <!-- ID MATCHED: offDutyCount -->
            <h3 id="offDutyCount">0</h3>
        </div>
    </div>
</div>
        <!-- Mechanics List -->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th>Mechanic</th>
                            <th>Specialization</th>
                            <th>Experience</th>
                            <th>Contact</th>
                            <th>Status</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="mechanicTableBody">
                        <!-- Data will be loaded via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal: Add Mechanic -->
    <div class="modal fade" id="addMechanicModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">New Mechanic Profile</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="mechanicForm">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="mName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Specialization</label>
                            <select id="mSpec" class="form-select">
                                <option>Engine Specialist</option>
                                <option>Electrical Expert</option>
                                <option>Brake & Suspension</option>
                                <option>Hybrid System Pro</option>
                                <option>Body & Paint</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Experience (Years)</label>
                                <input type="number" id="mExp" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Phone No</label>
                                <input type="text" id="mPhone" class="form-control" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Register Mechanic</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/mechanics.js"></script>
</body>
</html>
