<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicles - VSMS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
font-family: Arial;
background:#f4f6f9;
}

.sidebar{
height:100vh;
width:220px;
position:fixed;
background:#0d6efd;
color:white;
padding-top:20px;
}

.sidebar a{
display:block;
padding:12px 20px;
color:white;
text-decoration:none;
border-radius:5px;
}

.sidebar a:hover{
background:rgba(255,255,255,0.2);
}

.main-content{
margin-left:220px;
padding:20px;
}

</style>

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

<h4 class="text-center">VSMS</h4>

<a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>

<a href="customers.html"><i class="bi bi-people"></i> Customers</a>

<a class="active" href="#"><i class="bi bi-car-front"></i> Vehicles</a>

<a href="#"><i class="bi bi-tools"></i> Services</a>

<a href="#"><i class="bi bi-person-workspace"></i> Mechanics</a>

<a href="#"><i class="bi bi-box-seam"></i> Inventory</a>

<a href="#"><i class="bi bi-file-earmark-text"></i> Reports</a>

</div>

<!-- Main Content -->

<div class="main-content">

<nav class="navbar bg-white shadow-sm mb-4">
<div class="container-fluid">
<h4>Vehicle Management</h4>
</div>
</nav>

<!-- Add Vehicle Button -->

<button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#addVehicleModal">

<i class="bi bi-car-front-fill"></i> Add Vehicle

</button>

<!-- Search -->

<input type="text" class="form-control mb-3" placeholder="Search vehicle">

<!-- Vehicle Table -->

<div class="card">

<div class="card-header bg-success text-white">
Vehicle List
</div>

<div class="card-body table-responsive">

<table class="table table-striped table-hover">

<thead>

<tr>
<th>ID</th>
<th>Vehicle Number</th>
<th>Model</th>
<th>Year</th>
<th>Customer</th>
<th>Phone</th>
<th>Action</th>
</tr>

</thead>

<tbody>

<tr>
<td>1</td>
<td>WP ABC 1234</td>
<td>Toyota Corolla</td>
<td>2018</td>
<td>John Doe</td>
<td>0771234567</td>

<td>

<button class="btn btn-sm btn-warning">
<i class="bi bi-pencil"></i>
</button>

<button class="btn btn-sm btn-danger">
<i class="bi bi-trash"></i>
</button>

</td>

</tr>

<tr>
<td>2</td>
<td>WP XYZ 5678</td>
<td>Honda Civic</td>
<td>2020</td>
<td>Mary Jane</td>
<td>0759876543</td>

<td>

<button class="btn btn-sm btn-warning">
<i class="bi bi-pencil"></i>
</button>

<button class="btn btn-sm btn-danger">
<i class="bi bi-trash"></i>
</button>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

<!-- Add Vehicle Modal -->

<div class="modal fade" id="addVehicleModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5>Add Vehicle</h5>

<button class="btn-close" data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">

<form>

<div class="mb-3">

<label>Select Customer</label>

<select class="form-control">

<option>John Doe</option>
<option>Mary Jane</option>

</select>

</div>

<div class="mb-3">

<label>Vehicle Number</label>

<input type="text" class="form-control">

</div>

<div class="mb-3">

<label>Vehicle Model</label>

<input type="text" class="form-control">

</div>

<div class="mb-3">

<label>Manufacture Year</label>

<input type="number" class="form-control">

</div>

<button class="btn btn-success">Save Vehicle</button>

</form>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
