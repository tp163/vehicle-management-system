<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventory - VSMS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
font-family: Arial;
background:#f4f6f9;
}

.sidebar{
height:100vh;
width:220px;
position:fixed;
background:#0d6efd;
color:white;
padding-top:20px;
}

.sidebar a{
display:block;
padding:12px 20px;
color:white;
text-decoration:none;
border-radius:5px;
}

.sidebar a:hover{
background:rgba(255,255,255,0.2);
}

.main-content{
margin-left:220px;
padding:20px;
}

</style>

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

<h4 class="text-center">VSMS</h4>

<a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="customers.html"><i class="bi bi-people"></i> Customers</a>
<a href="vehicles.html"><i class="bi bi-car-front"></i> Vehicles</a>
<a href="services.html"><i class="bi bi-tools"></i> Services</a>
<a href="#"><i class="bi bi-person-workspace"></i> Mechanics</a>

<a class="active" href="#">
<i class="bi bi-box-seam"></i> Inventory
</a>

<a href="#"><i class="bi bi-file-earmark-text"></i> Reports</a>

</div>

<!-- Main Content -->

<div class="main-content">

<nav class="navbar bg-white shadow-sm mb-4">
<div class="container-fluid">
<h4>Spare Parts Inventory</h4>
</div>
</nav>

<!-- Add Item Button -->

<button class="btn btn-info mb-3" data-bs-toggle="modal" data-bs-target="#addItemModal">

<i class="bi bi-plus-circle"></i> Add Spare Part

</button>

<!-- Search -->

<input type="text" class="form-control mb-3" placeholder="Search spare parts">

<!-- Inventory Table -->

<div class="card">

<div class="card-header bg-info text-white">
Inventory List
</div>

<div class="card-body table-responsive">

<table class="table table-striped table-hover">

<thead>

<tr>
<th>ID</th>
<th>Part Name</th>
<th>Category</th>
<th>Quantity</th>
<th>Price</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>

<tbody>

<tr>
<td>1</td>
<td>Engine Oil</td>
<td>Lubricant</td>
<td>25</td>
<td>$15</td>

<td>
<span class="badge bg-success">In Stock</span>
</td>

<td>

<button class="btn btn-sm btn-warning">
<i class="bi bi-pencil"></i>
</button>

<button class="btn btn-sm btn-danger">
<i class="bi bi-trash"></i>
</button>

</td>

</tr>

<tr>
<td>2</td>
<td>Brake Pads</td>
<td>Brake System</td>
<td>3</td>
<td>$40</td>

<td>
<span class="badge bg-danger">Low Stock</span>
</td>

<td>

<button class="btn btn-sm btn-warning">
<i class="bi bi-pencil"></i>
</button>

<button class="btn btn-sm btn-danger">
<i class="bi bi-trash"></i>
</button>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

<!-- Add Spare Part Modal -->

<div class="modal fade" id="addItemModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5>Add Spare Part</h5>

<button class="btn-close" data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">

<form>

<div class="mb-3">
<label>Part Name</label>
<input type="text" class="form-control">
</div>

<div class="mb-3">
<label>Category</label>
<input type="text" class="form-control">
</div>

<div class="mb-3">
<label>Quantity</label>
<input type="number" class="form-control">
</div>

<div class="mb-3">
<label>Price</label>
<input type="number" class="form-control">
</div>

<button class="btn btn-info">Save Item</button>

</form>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
