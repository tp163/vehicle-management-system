<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicles - VSMS</title>
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/vehicles.css">
</head>
<body>

    <!-- Sidebar (Consistent Navy Theme) -->
    <div class="sidebar shadow">
        <h4 class="text-center py-3 border-bottom border-light border-opacity-25">VSMS</h4>
        <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="customers.html"><i class="bi bi-people"></i> Customers</a>
        <a class="active" href="vehicles.html"><i class="bi bi-car-front"></i> Vehicles</a>
        <a href="services.html"><i class="bi bi-tools"></i> Services</a>
        <a href="mechanics.html"><i class="bi bi-person-workspace"></i> Mechanics</a>
        <a href="staff.html"><i class="bi bi-person-badge"></i> Staff</a>
        <a href="inventory.html"><i class="bi bi-box-seam"></i> Inventory</a>
        <a href="invoices.html"><i class="bi bi-receipt"></i> Invoices</a>
        <a href="reports.html"><i class="bi bi-file-earmark-text"></i> Reports</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <nav class="navbar bg-white shadow-sm mb-4 px-3 rounded">
            <h4 class="mb-0 text-primary fw-bold">Vehicle Fleet</h4>
            <div class="ms-auto d-flex gap-2">
                <input type="text" id="vehSearch" class="form-control form-control-sm" placeholder="Search Plate No...">
                <button class="btn btn-primary btn-sm px-3" data-bs-toggle="modal" data-bs-target="#addVehicleModal">
                    <i class="bi bi-plus-circle"></i> Add Vehicle
                </button>
            </div>
        </nav>

        <!-- Vehicle Stats -->
  <!-- Vehicle Stats -->
<div class="row mb-4">
    <div class="col-md-4">
        <div class="card border-0 shadow-sm p-3 border-start border-primary border-4">
            <small class="text-muted fw-bold">TOTAL REGISTERED</small>
            <h3 id="totalVehicles">0</h3>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card border-0 shadow-sm p-3 border-start border-info border-4">
            <small class="text-muted fw-bold">CURRENTLY IN SHOP</small>
            <!-- Added ID here -->
            <h3 id="inShopCount" class="text-info">0</h3>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card border-0 shadow-sm p-3 border-start border-warning border-4">
            <small class="text-muted fw-bold">DUE FOR SERVICE</small>
            <!-- Added ID here -->
            <h3 id="dueCount" class="text-warning">0</h3>
        </div>
    </div>
</div>
        <!-- Vehicle Table -->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th>Plate Number</th>
                            <th>Brand & Model</th>
                            <th>Owner</th>
                            <th>Year</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="vehicleTableBody">
                        <!-- Data loaded via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal: Add Vehicle -->
    <div class="modal fade" id="addVehicleModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Register Vehicle</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="vehicleForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Plate Number</label>
                            <input type="text" id="vPlate" class="form-control" placeholder="WP ABC-1234" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Brand</label>
                                <input type="text" id="vBrand" class="form-control" placeholder="Toyota" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Model</label>
                                <input type="text" id="vModel" class="form-control" placeholder="Corolla" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold">Vehicle Year</label>
                             <input type="number" id="vYear" class="form-control" placeholder="e.g. 2018" required>
                        </div>


                        <div class="mb-3">
                            <label class="form-label small fw-bold">Owner Name</label>
                            <select id="vOwner" class="form-select" required>
                                <option value="" selected disabled>Select Owner</option>
                                <!-- Options will be filled by JS -->
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Save Vehicle</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/vehicles.js"></script>
</body>
</html>
